name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels its earlier run; runs on main always finish
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    # Well above a normal run, so a stuck container fails fast instead of after the 6 hour default
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Nothing here pushes, so the token needn't stay in the git config
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          cache: npm
          node-version: 24

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      # Unit and integration tests; the runner's Docker hosts the Testcontainers Postgres
      - run: npm run test:coverage
